name: loyce-dairies-db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: loyce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: loyce_dairies

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyce -d loyce_dairies"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
